function voucherHTML(v){const br=(state.branches||[]).find(b=>b.id===v.branchId);const previous=state.vouchers.filter(x=>!x.void&&x.studentId===v.studentId&&x.month<v.month),arrears=sum(previous.map(x=>C.balance(state,x)));return `<div class="voucherpage">${['Parent copy','School copy','Bank copy'].map(copy=>`<article class="voucher"><div class="schoolhead">${state.settings.logo?`<img src="${esc(state.settings.logo)}" alt="School logo">`:''}<h2>${esc(state.settings.school)}${br?` · ${esc(br.name)}`:''}</h2><p>${esc(br?.address||state.settings.address)}<br>${esc(br?.phone||state.settings.phone)}</p></div><div class="copy">MONTHLY FEE VOUCHER · ${copy}</div><h3>${esc(v.number)} ${v.void?'— VOID':''}</h3><p><b>${esc(v.snapshot.name)}</b><br>Admission: ${esc(v.snapshot.reg)}<br>Class: ${esc(v.snapshot.className)}<br>Guardian: ${esc(v.snapshot.guardian)}</p><dl><dt>Fee month</dt><dd>${v.month}</dd><dt>Issued</dt><dd>${v.issued}</dd><dt>Due date</dt><dd>${v.due}</dd></dl><table><tbody>${v.lines.map(l=>`<tr><td>${esc(l.name)}</td><td>${cash(l.amount)}</td></tr>`).join('')}<tr><td>Concession</td><td>− ${cash(v.discount)}</td></tr><tr class="bold"><td>This voucher total</td><td>${cash(C.total(v))}</td></tr><tr><td>Received against voucher</td><td>${cash(C.applied(state,v.id))}</td></tr><tr class="bold"><td>This voucher balance</td><td>${cash(C.balance(state,v))}</td></tr><tr><td>Earlier unpaid vouchers*</td><td>${cash(arrears)}</td></tr><tr class="bold"><td>Payable including earlier dues</td><td>${cash(v.void?0:C.balance(state,v)+arrears)}</td></tr></tbody></table><p class="tiny">*Earlier dues are shown for reference, not charged again. Balances are current as of printing. ${v.void?'This voucher is void; do not collect against it.':''}</p><p>${esc(state.settings.bank)}<br>${esc(state.settings.account)}</p><p class="tiny">${esc(state.settings.instructions)}</p><div class="signature">Authorized stamp / signature</div></article>`).join('')}</div>`}
function receiptHTML(p){const student=p.snapshot||find('students',p.studentId),cls=find('classes',(find('students',p.studentId)||{}).classId),brn=cls?find('branches',cls.branchId):null;return `<article class="receipt"><h2>${esc(state.settings.school)}</h2><p>${esc(state.settings.address)} · ${esc(state.settings.phone)}${brn?` · ${esc(brn.name)}`:''}</p><h1>Payment receipt ${p.reversed?'— REVERSED':''}</h1><h3>${p.number}</h3><dl><dt>Date</dt><dd>${p.date}</dd><dt>Student</dt><dd>${esc(student.name)} · ${esc(student.reg)}</dd><dt>Amount received</dt><dd><b>${cash(p.amount)}</b></dd><dt>Method</dt><dd>${esc(p.method)}</dd><dt>Reference</dt><dd>${esc(p.reference||'—')}</dd></dl><h3>Allocated to fees</h3>${table(['Voucher','Month','Applied'],p.allocations.map(a=>{const v=find('vouchers',a.voucherId);return `<tr><td>${v.number}</td><td>${v.month}</td><td>${cash(a.amount)}</td></tr>`}))}<p>${esc(p.note)}</p>${p.reversed?'<p>This receipt has been reversed and does not count as a payment.</p>':''}<p>Current remaining student balance: ${cash(C.outstanding(state,p.studentId))}</p><div class="signature">Received by / school stamp</div></article>`}

if(a==='backup'){download(JSON.stringify(state),`Fee-Harbor-backup-${C.today()}.json`,'application/json');await mutate(s=>{s.settings.lastBackup=new Date().toLocaleString('en-PK')})}if(a==='restore'){importMode='backup';$('#importFile').accept='.json';$('#importFile').click()}if(a==='csvImport'){importMode='students';$('#importFile').accept='.csv,.tsv';$('#importFile').click()}if(a==='csvTemplate')csvDownload(['Admission No','Student Name','Class','Section','Guardian','Phone','Admission Date','Concession','Tuition Override','Notes'],[],'Student-Import-Template');

if(a==='voucherCSV')csvDownload(['Voucher','Month','Admission No','Student','Total PKR','Paid PKR','Balance PKR','Status'],filteredVouchers().map(v=>[v.number,v.month,v.snapshot.reg,v.snapshot.name,C.total(v)/100,C.applied(state,v.id)/100,C.balance(state,v)/100,status(v)]),'Fee-Vouchers');
if(a==='outstandingCSV')csvDownload(['Admission No','Student','Phone','Outstanding PKR'],filterStudents().filter(p=>C.outstanding(state,p.id)>0).map(p=>[p.reg,p.name,p.phone,C.outstanding(state,p.id)/100]),'Outstanding-Fees');

if(a==='storage'){const q=await navigator.storage?.estimate?.(),persistent=await navigator.storage?.persist?.();$('#storageInfo').textContent=`Using ${((q?.usage||0)/1048576).toFixed(1)} MB of approximately ${((q?.quota||0)/1048576).toFixed(0)} MB. Persistent storage ${persistent?'granted':'not granted'}. Keep independent backups.`;}});
