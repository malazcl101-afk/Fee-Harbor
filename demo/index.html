const FeeCore=(()=>{

function generate(s,{month,due,issued,classId='',branchId='',extraName='',extra=0}){

function receiptHTML(p){const student=p.snapshot||find('students',p.studentId),cls=find('classes',(find('students',p.studentId)||{}).classId),brn=cls?find('branches',cls.branchId):null;return `<article class="receipt"><h2>${esc(state.settings.school)}</h2><p>${esc(state.settings.address)} · ${esc(state.settings.phone)}${brn?` · ${esc(brn.name)}`:''}</p><h1>Payment receipt ${p.reversed?'— REVERSED':''}</h1><h3>${p.number}</h3><dl><dt>Date</dt><dd>${p.date}</dd><dt>Student</dt><dd>${esc(student.name)} · ${esc(student.reg)}</dd><dt>Amount received</dt><dd><b>${cash(p.amount)}</b></dd><dt>Method</dt><dd>${esc(p.method)}</dd><dt>Reference</dt><dd>${esc(p.reference||'—')}</dd></dl><h3>Allocated to fees</h3>${table(['Voucher','Month','Applied'],p.allocations.map(a=>{const v=find('vouchers',a.voucherId);return `<tr><td>${v.number}</td><td>${v.month}</td><td>${cash(a.amount)}</td></tr>`}))}<p>${esc(p.note)}</p>${p.reversed?'<p>This receipt has been reversed and does not count as a payment.</p>':''}<p>Current remaining student balance: ${cash(C.outstanding(state,p.studentId))}</p><div class="signature">Received by / school stamp</div></article>`}

if(a==='headRename'){const h=find('feeHeads',id);const name=prompt('Fee head name, as printed on vouchers:',h?.name||'');if(!name?.trim())return;await mutate(s=>{s.feeHeads.find(x=>x.id===id).name=name.trim();C.log(s,'Fee head renamed',id,name.trim())})}

if(a==='headUp'||a==='headDown')await mutate(s=>{const i=s.feeHeads.findIndex(x=>x.id===id),j=a==='headUp'?i-1:i+1;if(i<0||j<0||j>=s.feeHeads.length)return;const t=s.feeHeads[i];s.feeHeads[i]=s.feeHeads[j];s.feeHeads[j]=t;C.log(s,'Fee head order changed',id,'')});
if(a==='theme')await mutate(s=>{s.settings.theme=b.dataset.theme});if(a==='resetTheme')await mutate(s=>Object.assign(s.settings,{theme:'Ocean',font:'Sans',density:'Comfortable',size:16,contrast:false}));
if(a==='backup'){download(JSON.stringify(state),`Fee-Harbor-backup-${C.today()}.json`,'application/json');await mutate(s=>{s.settings.lastBackup=new Date().toLocaleString('en-PK')})}if(a==='restore'){importMode='backup';$('#importFile').accept='.json';$('#importFile').click()}if(a==='csvImport'){importMode='students';$('#importFile').accept='.csv,.tsv';$('#importFile').click()}if(a==='csvTemplate')csvDownload(['Admission No','Student Name','Class','Section','Guardian','Phone','Admission Date','Concession','Tuition Override','Notes'],[],'Student-Import-Template');
if(a==='studentsCSV')csvDownload(['Branch','Admission No','Student Name','Class','Section','Guardian','Phone','Admission Date','Concession','Tuition Override','Notes'],psForExport().map(p=>{const c=find('classes',p.classId);return [find('branches',c.branchId)?.name||'',p.reg,p.name,c.name,c.section,p.guardian,p.phone,p.admission,p.discount/100,p.override===null?'':p.override/100,p.notes]}),'Students');
if(a==='voucherCSV')csvDownload(['Voucher','Month','Admission No','Student','Total PKR','Paid PKR','Balance PKR','Status'],filteredVouchers().map(v=>[v.number,v.month,v.snapshot.reg,v.snapshot.name,C.total(v)/100,C.applied(state,v.id)/100,C.balance(state,v)/100,status(v)]),'Fee-Vouchers');
if(a==='outstandingCSV')csvDownload(['Admission No','Student','Phone','Outstanding PKR'],filterStudents().filter(p=>C.outstanding(state,p.id)>0).map(p=>[p.reg,p.name,p.phone,C.outstanding(state,p.id)/100]),'Outstanding-Fees');
if(a==='reportCSV')csvDownload(['Receipt','Date','Admission No','Student','Amount PKR','Method','Reference'],state.payments.filter(p=>!p.reversed&&p.date.startsWith(period)&&filterStudents().some(x=>x.id===p.studentId)).map(p=>{const st=find('students',p.studentId);return [p.number,p.date,st.reg,st.name,p.amount/100,p.method,p.reference]}),'Monthly-Collections');
if(a==='storage'){const q=await navigator.storage?.estimate?.(),persistent=await navigator.storage?.persist?.();$('#storageInfo').textContent=`Using ${((q?.usage||0)/1048576).toFixed(1)} MB of approximately ${((q?.quota||0)/1048576).toFixed(0)} MB. Persistent storage ${persistent?'granted':'not granted'}. Keep independent backups.`;}});
function psForExport(){return filterStudents()}
$('#app').addEventListener('change',e=>{if(e.target.id==='month'){period=e.target.value||C.today().slice(0,7);page=1;render()}if(e.target.id==='classFilter'){classFilter=e.target.value;page=1;render()}if(e.target.id==='branchFilter'){branchFilter=e.target.value;classFilter='';page=1;render()}if(e.target.id==='ledgerStudent'){ledgerStudent=e.target.value;render()}if(e.target.closest('#entryForm')&&editing.type==='payment'&&e.target.name==='studentId')$('#paymentBalance').textContent='Outstanding: '+cash(C.outstanding(state,e.target.value));if(e.target.closest('#entryForm')&&editing.type==='generate')previewGeneration()});
$('#globalSearch').addEventListener('input',e=>{const v=e.target.value;clearTimeout(queryTimer);queryTimer=setTimeout(()=>{search=v.toLowerCase();page=1;render()},150)});
$('#app').addEventListener('submit',async e=>{if(!['schoolForm','appearanceForm','voucherOptionsForm'].includes(e.target.id))return;e.preventDefault();const d=new FormData(e.target);try{let logo;if(e.target.id==='schoolForm'&&d.get('logo')?.size){const file=d.get('logo');if(file.size>1024*1024||!['image/png','image/jpeg','image/webp'].includes(file.type))throw Error('Use a PNG, JPG or WebP logo under 1 MB.');logo=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}const type=e.target.id;await mutate(s=>{if(type==='schoolForm'){for(const k of ['school','address','phone','bank','account','instructions'])s.settings[k]=String(d.get(k)||'').trim();s.settings.dueDay=Number(d.get('dueDay'));if(logo)s.settings.logo=logo;else if(d.has('removeLogo'))s.settings.logo='';C.log(s,'School settings saved','school')}else if(type==='voucherOptionsForm'){s.settings.showZeroHeads=d.has('showZeroHeads');C.log(s,'Voucher options saved','school')}else{for(const k of ['font','density'])s.settings[k]=d.get(k);s.settings.size=Number(d.get('size'));s.settings.contrast=d.has('contrast')}})}catch(err){message(err.message)}});
$('#importFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>30*1024*1024)throw Error('Import limit is 30 MB.');const text=await f.text();if(importMode==='students'){const tb=branchFilter||state.branches[0]?.id||'',copy=structuredClone(state),count=C.importStudents(copy,text,tb);C.validate(copy);if(!confirm(`Import ${count} validated students into ${find('branches',tb)?.name||'the school'}? Classes are matched inside that branch. No existing records will be replaced.`))return;const saved=await mutate(s=>{C.importStudents(s,text,tb)});if(saved!==false)message(count+' students imported into '+(find('branches',tb)?.name||'the school')+'.')}else{const raw=JSON.parse(text);C.migrate(raw);const incoming=C.validate(raw);if(!confirm('Replace ALL school records with this backup? Download your current backup first.'))return;await mutate(s=>{const revision=s.revision;Object.keys(s).forEach(k=>delete s[k]);Object.assign(s,incoming);s.revision=revision;C.log(s,'Backup restored','backup')});classFilter='';branchFilter='';ledgerStudent='';render()}}catch(err){message('Import rejected: '+err.message)}finally{e.target.value=''}});
async function init(){$('#nav').innerHTML=[['Office',['dashboard','students','classes']],['Fee management',['vouchers','payments','defaulters','ledger']],['Administration',['expenses','reports','audit','settings']]].map(([g,vs])=>`<small class="navgroup">${g}</small>${vs.map(v=>`<button data-view="${v}"><span>${icon[v]}</span>${v==='dashboard'?'Dashboard':v==='classes'?'Classes & fees':v==='vouchers'?'Fee vouchers':v==='defaulters'?'Outstanding fees':v==='ledger'?'Student ledger':v[0].toUpperCase()+v.slice(1)}</button>`).join('')}`).join('');try{const s=await openDB();let mig=false;if(s){mig=C.migrate(s);state=C.validate(s)}ready=true;apply();render();if(mig)await mutate(()=>{});$('#saveState').textContent='Saved on this device'}catch(e){$('#content').innerHTML='<article class="notice"><h2>Browser storage could not be opened.</h2><p>Use a regular browser window with storage enabled. Your existing records have not been overwritten.</p></article>';message(e.message)}}
init();
window.addEventListener('beforeprint',()=>{if(!$('#printDialog').open)$('#printPreview').innerHTML=`<article class="receipt"><h2>${esc(state.settings.school)}</h2><p>${esc(names[view])} · ${period}</p>${$('#content').innerHTML}</article>`});

/* PWA: register the service worker when the app is served over the web
   (or localhost). Opened as a plain file it stays fully offline-capable
   on its own and this block simply does nothing. */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () { /* offline file use is unaffected */ });

}
